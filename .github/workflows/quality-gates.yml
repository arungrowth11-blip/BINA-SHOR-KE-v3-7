name: BINA SHOR KE — Offline Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install small local dependencies only
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile all project Python files
        run: python -m compileall -q scripts tests
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify workflow YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in sorted(Path(".github/workflows").glob("*.yml")):
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"YAML OK: {path}")
          PY
