name: BINA SHOR KE v4 — Offline Quality Gates

on:
  push:
    branches: [v4-rebuild]
  pull_request:
    branches: [v4-rebuild]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bsk-v4-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout v4 branch
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install local requirements
        run: python -m pip install --disable-pip-version-check -e . -r requirements.txt
      - name: Compile source and tests
        run: python -m compileall -q src tests scripts
      - name: Run offline tests only
        run: python -m unittest discover -s tests -v
      - name: Validate workflow safety
        run: python scripts/validate_workflows.py
