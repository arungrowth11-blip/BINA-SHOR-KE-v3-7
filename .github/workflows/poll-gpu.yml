name: BINA SHOR KE — GPU Poll, Final Edit, QA and Telegram

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Poll, retry a failed stage, run a guarded repair, or rebuild a timing-only QA rejection"
        required: true
        default: "poll"
        type: choice
        options:
          - "poll"
          - "retry-finalize"
          - "repair-rhythm"
          - "repair-scene-voiceover"
          - "repair-scene-6-voiceover"
          - "repair-scene-6-voiceover-followup"
          - "rebuild-rejected-timing"
          - "retry-gpu"
          - "resume-checkpoint"
          - "resolve-dispatch-running"
          - "resolve-dispatch-not-started"
  # Scheduled workflows run from the repository default branch only. This narrow
  # feature-branch hook performs one poll when this workflow is intentionally updated;
  # its default action is `poll`; only the explicit timeout-retry commit marker
  # selects `retry-gpu`. Pending-state commits do not match this path, so no loop forms.
  push:
    branches:
      - feature/voice-first-3d-foundation
    paths:
      - ".github/workflows/poll-gpu.yml"
  schedule:
    - cron: "0 */2 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: bina-shor-ke-studio
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      POLL_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || (github.event_name == 'push' && contains(github.event.head_commit.message, '[bsk-timeout-retry]') && 'retry-gpu' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[bsk-vision-fallback-retry]') && 'retry-finalize' || 'poll')) }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_WORKERS_AI_FREE_ONLY: ${{ secrets.CF_WORKERS_AI_FREE_ONLY }}
      BSK_TEXT_PROVIDER: gemini
      GROQ_TEXT_MODEL: openai/gpt-oss-120b
      MISTRAL_TEXT_MODEL: ministral-8b-latest
      CF_TEXT_MODEL: "@cf/meta/llama-3.1-8b-instruct"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_KERNEL_SLUG: ${{ vars.KAGGLE_KERNEL_SLUG }}
      GEMINI_TEXT_MODEL: gemini-3.8-flash
      GEMINI_TTS_MODEL: gemini-3.8-flash-lite-tts
      TTS_VOICE: Kore
      REQUIRE_AI_VIDEO: "1"
      BSK_ASR_QA: "1"
      BSK_ASR_MODEL: large-v3-turbo
      HF_HOME: ~/.cache/huggingface
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh queued feature-branch dispatch to latest state
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/voice-first-3d-foundation'
        shell: bash
        run: |
          # workflow_dispatch keeps the event SHA while waiting for the concurrency lock.
          # Refresh here so a queued retry reads state persisted by the preceding run.
          git fetch --no-tags origin "$GITHUB_REF"
          git reset --hard FETCH_HEAD
          echo "Feature branch refreshed to $(git rev-parse --short HEAD)"

      - name: Check whether a GPU batch actually needs polling (stdlib only)
        id: pending
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("data/pending_gpu_job.json")
          if path.exists():
              try:
                  state = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise SystemExit(f"pending_gpu_job.json is invalid JSON; refusing to silently skip GPU work: {exc}")
          else:
              state = {}
          if not isinstance(state, dict):
              raise SystemExit("pending_gpu_job.json must contain a JSON object; refusing to continue")
          action = os.environ.get("POLL_ACTION", "poll")
          poll_states = {"gpu_running", "gpu_complete"}
          retry_states = {"finalize_failed", "finalizing", "gpu_failed"}
          qa_reason = str(state.get("qa_rejection_reason", "")).lower()
          rhythm_repair_ok = (state.get("status") == "qa_rejected"
                              and "would require excessive speed change" in qa_reason
                              and "critical visual defect" not in qa_reason
                              and "too short" not in qa_reason
                              and int(state.get("rhythm_repair_attempts", 0) or 0) < 1)
          import re
          # The QA exception text in v3.7.4b records the ratio but omits the scene index
          # ("AI scene would require ..."). Accept that exact format as well as an
          # explicit "AI scene 5 ..." message, but keep the target Reel, source line,
          # preceding rhythm-repair attempt, and one-time/ratio guards exact.
          scene5_match = re.search(
              r"AI scene(?:\s+5)?\s+would require excessive speed change\s*\(([0-9.]+)x\)",
              str(state.get("qa_rejection_reason", "")), re.IGNORECASE,
          )
          state_reels = state.get("reels") if isinstance(state.get("reels"), list) else []
          scene5_reel = next(
              (item for item in state_reels if isinstance(item, dict) and item.get("reel_id") == "reel_01_115742"),
              None,
          )
          scene5_concept = scene5_reel.get("concept") if isinstance(scene5_reel, dict) and isinstance(scene5_reel.get("concept"), dict) else {}
          scene5_beats = scene5_concept.get("beats") if isinstance(scene5_concept.get("beats"), list) else []
          scene5_source_matches = (
              scene5_concept.get("title") == "सूखी छतरी"
              and len(scene5_beats) == 6
              and isinstance(scene5_beats[4], dict)
              and int(scene5_beats[4].get("scene_index", 5)) == 5
              and scene5_beats[4].get("voiceover") == "सुमित चुपचाप बालकनी में अपनी भीगी कमीज़ निचोड़ रहा था।"
          )
          scene5_voiceover_repair_ok = (
              state.get("status") == "qa_rejected"
              and scene5_match is not None
              and 1.66 <= float(scene5_match.group(1)) <= 1.68
              and state.get("active_finalizing_reel_id") == "reel_01_115742"
              and int(state.get("rhythm_repair_attempts", 0) or 0) == 1
              and scene5_source_matches
              and int(state.get("scene_voiceover_repair_attempts", 0) or 0) < 1
          )
          # Scene 6 repair is allowed only after the single Scene 5 rewrite was applied,
          # and only for this Reel's observed 1.62x generic QA rejection.
          scene6_match = re.search(
              r"AI scene(?:\s+6)?\s+would require excessive speed change\s*\(([0-9.]+)x\)",
              str(state.get("qa_rejection_reason", "")), re.IGNORECASE,
          )
          scene6_reel = next(
              (item for item in state_reels if isinstance(item, dict) and item.get("reel_id") == "reel_01_115742"),
              None,
          )
          scene6_concept = scene6_reel.get("concept") if isinstance(scene6_reel, dict) and isinstance(scene6_reel.get("concept"), dict) else {}
          scene6_beats = scene6_concept.get("beats") if isinstance(scene6_concept.get("beats"), list) else []
          scene6_source_matches = (
              scene6_concept.get("title") == "सूखी छतरी"
              and len(scene6_beats) == 6
              and isinstance(scene6_beats[4], dict)
              and scene6_beats[4].get("voiceover") == "सुमित ने चुपचाप अपनी भीगी कमीज़ निचोड़ दी।"
              and isinstance(scene6_beats[5], dict)
              and int(scene6_beats[5].get("scene_index", 6)) == 6
              and scene6_beats[5].get("voiceover") == "उसने सूखी छतरी टांग दी, मगर कमरा चुप ही रहा।"
          )
          scene6_voiceover_repair_ok = (
              state.get("status") == "qa_rejected"
              and scene6_match is not None
              and 1.61 <= float(scene6_match.group(1)) <= 1.63
              and state.get("active_finalizing_reel_id") == "reel_01_115742"
              and int(state.get("rhythm_repair_attempts", 0) or 0) == 1
              and int(state.get("scene_voiceover_repair_attempts", 0) or 0) == 1
              and scene6_source_matches
              and int(state.get("scene6_voiceover_repair_attempts", 0) or 0) < 1
          )
          # One final Scene 6 shortening is allowed only after the first Scene 6
          # rewrite was applied and rejected at the exact observed 1.54x ratio.
          scene6_followup_match = re.search(
              r"AI scene(?:\s+6)?\s+would require excessive speed change\s*\(([0-9.]+)x\)",
              str(state.get("qa_rejection_reason", "")), re.IGNORECASE,
          )
          scene6_followup_ok = (
              state.get("status") == "qa_rejected"
              and scene6_followup_match is not None
              and 1.53 <= float(scene6_followup_match.group(1)) <= 1.55
              and state.get("active_finalizing_reel_id") == "reel_01_115742"
              and int(state.get("rhythm_repair_attempts", 0) or 0) == 1
              and int(state.get("scene_voiceover_repair_attempts", 0) or 0) == 1
              and int(state.get("scene6_voiceover_repair_attempts", 0) or 0) == 1
              and isinstance(state.get("scene6_voiceover_repair"), dict)
              and state["scene6_voiceover_repair"].get("status") in {"qa_rejected_again", "in_progress"}
              and len(scene6_beats) == 6
              and scene6_concept.get("title") == "सूखी छतरी"
              and scene6_beats[4].get("voiceover") == "सुमित ने चुपचाप अपनी भीगी कमीज़ निचोड़ दी।"
              and scene6_beats[5].get("voiceover") == "उसने सूखी छतरी टाँगी, मगर कमरा चुप रहा।"
              and int(state.get("scene6_voiceover_followup_attempts", 0) or 0) < 1
          )
          timing_rebuild_ok = (
              state.get("status") == "qa_rejected"
              and "would require excessive speed change" in qa_reason
              and "critical visual defect" not in qa_reason
              and "too short" not in qa_reason
              and "black frame" not in qa_reason
              and "freeze defect" not in qa_reason
              and int(state.get("timing_rebuild_attempts", 0) or 0) < 1
              and isinstance(state.get("reels"), list)
              and len(state.get("reels")) == 1
              and bool(state.get("active_finalizing_reel_id"))
              and state["reels"][0].get("reel_id") == state.get("active_finalizing_reel_id")
              and state["reels"][0].get("delivery_status") != "delivered"
          )
          gpu_error_raw = state.get("gpu_error", "")
          try:
              gpu_error_payload = json.loads(gpu_error_raw) if isinstance(gpu_error_raw, str) else gpu_error_raw
          except (TypeError, ValueError):
              gpu_error_payload = {}
          gpu_error_text = json.dumps(gpu_error_raw, ensure_ascii=False).lower()
          known_ksampler_failure = ("ksampler schema changed" in gpu_error_text
                                    or "control_after_generate" in gpu_error_text)
          known_hf_revision_failure = (
              "revisionnotfounderror" in gpu_error_text
              and ("invalid rev id: text_encoders" in gpu_error_text
                   or "invalid rev id: vae" in gpu_error_text)
          )
          known_comfyui_timeout = (
              isinstance(gpu_error_payload, dict)
              and gpu_error_payload.get("error_type") == "TimeoutError"
              and "ComfyUI scene generation timed out after 2700s" in str(gpu_error_payload.get("error", ""))
              and gpu_error_payload.get("stage") == "kaggle_gpu_render"
              and gpu_error_payload.get("manifest_id") == state.get("job_id")
          )
          gpu_retry_attempts = int(state.get("gpu_retry_attempts", 0) or 0)
          first_retry_ok = gpu_retry_attempts == 0 and (known_ksampler_failure or known_hf_revision_failure)
          timeout_retry_ok = gpu_retry_attempts == 1 and known_comfyui_timeout
          retry_gpu_ok = (state.get("status") == "gpu_failed"
                          and (first_retry_ok or timeout_retry_ok)
                          and not state.get("resume_dataset_id")
                          and int(state.get("resume_scene_count", 0) or 0) == 0
                          and not state.get("checkpoint_save_error")
                          and gpu_retry_attempts < 2)
          resolve_states = {"dispatch_unknown"}
          resume_states = {"gpu_checkpoint_saved"}
          if action == "retry-finalize":
              allowed = retry_states
          elif action == "repair-rhythm":
              allowed = {"qa_rejected"} if rhythm_repair_ok else set()
          elif action == "repair-scene-voiceover":
              allowed = {"qa_rejected"} if scene5_voiceover_repair_ok else set()
          elif action == "repair-scene-6-voiceover":
              allowed = {"qa_rejected"} if scene6_voiceover_repair_ok else set()
          elif action == "repair-scene-6-voiceover-followup":
              allowed = {"qa_rejected"} if scene6_followup_ok else set()
          elif action == "rebuild-rejected-timing":
              allowed = {"qa_rejected"} if timing_rebuild_ok else set()
          elif action == "retry-gpu":
              allowed = {"gpu_failed"} if retry_gpu_ok else set()
          elif action == "resume-checkpoint":
              allowed = resume_states
          elif action.startswith("resolve-dispatch-"):
              allowed = resolve_states
          else:
              allowed = poll_states
          active = state.get("status") in allowed
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("active=" + ("true" if active else "false") + "\n")
          print(f"Pending GPU state: {state.get('status', 'none')}; work_required={active}")
          PY

      - name: Set up Python
        if: steps.pending.outputs.active == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-asr.txt

      - name: Quick remote Kaggle status check (minimal CLI only)
        id: remote
        if: steps.pending.outputs.active == 'true' && env.POLL_ACTION == 'poll'
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q "six>=1.16.0,<2" kaggle
          mkdir -p "$HOME/.kaggle"
          printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > "$HOME/.kaggle/kaggle.json"
          chmod 600 "$HOME/.kaggle/kaggle.json"
          kernel_id="${KAGGLE_USERNAME}/${KAGGLE_KERNEL_SLUG:-bina-shor-ke-studio-video}"
          remote_status="$(kaggle kernels status "$kernel_id" 2>&1 || true)"
          # Emit a machine-readable timestamp for every remote status observation.
          status_checked_at_utc="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "status_checked_at_utc=${status_checked_at_utc}" >> "$GITHUB_OUTPUT"
          echo "KAGGLE_STATUS_CHECKED_AT_UTC=${status_checked_at_utc}"
          echo "$remote_status"
          if printf '%s' "$remote_status" | grep -Eqi 'RUNNING|QUEUED|COMPILING|CREATED'; then
            echo 'finalize_required=false' >> "$GITHUB_OUTPUT"
          else
            # Unknown/error states go through the full poller for safe diagnosis/recovery.
            echo 'finalize_required=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether full work is required
        id: work
        if: steps.pending.outputs.active == 'true'
        shell: bash
        run: |
          action="$POLL_ACTION"
          if [ "$action" = 'poll' ] && [ "${{ steps.remote.outputs.finalize_required }}" != 'true' ]; then
            echo 'required=false' >> "$GITHUB_OUTPUT"
            echo 'finalize=false' >> "$GITHUB_OUTPUT"
          else
            echo 'required=true' >> "$GITHUB_OUTPUT"
            if [ "$action" = 'retry-finalize' ] || [ "$action" = 'repair-rhythm' ] || [ "$action" = 'repair-scene-voiceover' ] || [ "$action" = 'repair-scene-6-voiceover' ] || [ "$action" = 'repair-scene-6-voiceover-followup' ] || [ "$action" = 'rebuild-rejected-timing' ] || [ "$action" = 'poll' ]; then
              echo 'finalize=true' >> "$GITHUB_OUTPUT"
            else
              echo 'finalize=false' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Restore verified narration WAV cache from earlier runs
        if: steps.work.outputs.finalize == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/tts_cache
          key: bsk-tts-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bsk-tts-${{ runner.os }}-

      - name: Install only missing FFmpeg and Devanagari prerequisites
        if: steps.work.outputs.finalize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1 || ! ffmpeg -filters 2>/dev/null | grep -q subtitles; then
            packages+=(ffmpeg)
          fi
          required_fonts=(
            /usr/share/fonts/truetype/noto/NotoSansDevanagari-Regular.ttf
            /usr/share/fonts/truetype/noto/NotoSansDevanagari-Bold.ttf
            /usr/share/fonts/truetype/noto/NotoSans-Regular.ttf
            /usr/share/fonts/truetype/noto/NotoSans-Bold.ttf
          )
          missing_fonts=false
          for font in "${required_fonts[@]}"; do
            if [ ! -s "$font" ]; then
              missing_fonts=true
              break
            fi
          done
          if [ "$missing_fonts" = true ]; then
            packages+=(fonts-noto-core)
          fi
          if ! command -v tesseract >/dev/null 2>&1 \
          || ! tesseract --list-langs 2>/dev/null | grep -qx eng \
          || ! tesseract --list-langs 2>/dev/null | grep -qx hin; then
            packages+=(tesseract-ocr tesseract-ocr-hin)
          fi
          if [ "${#packages[@]}" -gt 0 ]; then
            echo "Installing missing prerequisites only: ${packages[*]}"
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          else
            echo "FFmpeg subtitle filter and required Noto fonts already available; skipping apt update/install."
          fi
          command -v ffmpeg
          command -v ffprobe
          command -v tesseract
          tesseract --list-langs 2>/dev/null | grep -qx hin
          ffmpeg -filters 2>/dev/null | grep -q subtitles
          for font in "${required_fonts[@]}"; do
            test -s "$font" || { echo "Required Devanagari font missing after setup: $font" >&2; exit 1; }
          done

      - name: Restore local Hindi narration ASR model cache
        if: steps.work.outputs.finalize == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: bsk-whisper-large-v3-turbo-${{ runner.os }}-v1

      - name: Install dependencies and configure private Kaggle CLI
        if: steps.work.outputs.required == 'true'
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          if [ "$POLL_ACTION" = 'poll' ] || [ "$POLL_ACTION" = 'retry-finalize' ] || [ "$POLL_ACTION" = 'repair-rhythm' ] || [ "$POLL_ACTION" = 'repair-scene-voiceover' ] || [ "$POLL_ACTION" = 'repair-scene-6-voiceover' ] || [ "$POLL_ACTION" = 'repair-scene-6-voiceover-followup' ] || [ "$POLL_ACTION" = 'rebuild-rejected-timing' ]; then
            python -m pip install --disable-pip-version-check -r requirements-asr.txt
          fi
          python -m pip install --disable-pip-version-check "six>=1.16.0,<2" kaggle
          mkdir -p "$HOME/.kaggle"
          printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > "$HOME/.kaggle/kaggle.json"
          chmod 600 "$HOME/.kaggle/kaggle.json"

      - name: Poll active GPU job and finalize deliverables
        if: steps.work.outputs.finalize == 'true' && env.POLL_ACTION == 'poll'
        run: python scripts/studio_pipeline.py poll-finalize

      - name: Explicitly retry a failed/interrupted finalization
        if: steps.work.outputs.finalize == 'true' && env.POLL_ACTION == 'retry-finalize'
        run: python scripts/studio_pipeline.py retry-finalize

      - name: Repair borderline narration rhythm using the same AI scenes
        if: steps.work.outputs.finalize == 'true' && env.POLL_ACTION == 'repair-rhythm'
        run: python scripts/studio_pipeline.py repair-rhythm-finalize

      - name: Replace only Scene 5 Hindi narration and re-finalize the same AI scenes
        if: steps.work.outputs.finalize == 'true' && env.POLL_ACTION == 'repair-scene-voiceover'
        run: python scripts/studio_pipeline.py repair-scene-voiceover-finalize

      - name: Replace only Scene 6 Hindi narration and re-finalize the same AI scenes
        if: steps.work.outputs.finalize == 'true' && env.POLL_ACTION == 'repair-scene-6-voiceover'
        run: python scripts/studio_pipeline.py repair-scene-6-voiceover-finalize

      - name: Shorten only Scene 6 narration once more and re-finalize existing AI scenes
        if: steps.work.outputs.finalize == 'true' && env.POLL_ACTION == 'repair-scene-6-voiceover-followup'
        run: python scripts/studio_pipeline.py repair-scene-6-voiceover-followup-finalize

      - name: Rebuild a timing-only QA rejection from existing GPU scenes
        if: steps.work.outputs.finalize == 'true' && env.POLL_ACTION == 'rebuild-rejected-timing'
        run: python scripts/studio_pipeline.py rebuild-rejected-timing

      - name: Retry the same Reel after a narrowly classified worker fix
        if: steps.work.outputs.required == 'true' && env.POLL_ACTION == 'retry-gpu'
        run: python scripts/studio_pipeline.py retry-gpu

      - name: Resume from saved private scene checkpoints
        if: steps.work.outputs.required == 'true' && env.POLL_ACTION == 'resume-checkpoint'
        run: python scripts/studio_pipeline.py resume-checkpoint

      - name: Resolve an ambiguous Kaggle push — owner confirms the new run exists
        if: steps.work.outputs.required == 'true' && env.POLL_ACTION == 'resolve-dispatch-running'
        run: python scripts/studio_pipeline.py resolve-dispatch-running

      - name: Resolve an ambiguous Kaggle push — owner confirms no new run started
        if: steps.work.outputs.required == 'true' && env.POLL_ACTION == 'resolve-dispatch-not-started'
        run: python scripts/studio_pipeline.py resolve-dispatch-not-started

      - name: Upload the ready-for-human-review publish kit
        if: always() && steps.work.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bsk-publish-kit-${{ github.run_number }}
          path: |
            output/**/reel.mp4
            output/**/cover.png
            output/**/publish.txt
            output/**/credits.txt
            output/**/quality_report.json
            output/**/ai_visual_prompts.txt
            data/pending_gpu_job.json
            data/history.json
            data/performance_log.csv
          retention-days: 7
          if-no-files-found: ignore

      - name: Detect newly generated narration cache entries
        id: tts_cache_changed
        if: always() && steps.work.outputs.finalize == 'true'
        shell: bash
        run: |
          if [ -f data/tts_cache/.dirty ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            rm -f data/tts_cache/.dirty
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save verified narration WAV cache for retries
        if: always() && steps.work.outputs.finalize == 'true' && steps.tts_cache_changed.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/tts_cache
          key: bsk-tts-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Persist delivery and performance state
        if: always() && steps.work.outputs.required == 'true'
        continue-on-error: true
        run: |
          git config user.name "bina-shor-ke-studio[bot]"
          git config user.email "bina-shor-ke-studio[bot]@users.noreply.github.com"
