name: BINA SHOR KE — Telegram Feedback Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: bina-shor-ke-studio
  cancel-in-progress: false

jobs:
  sync-owner-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        if: env.TELEGRAM_BOT_TOKEN != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install only Telegram sync dependencies
        if: env.TELEGRAM_BOT_TOKEN != ''
        run: python -m pip install --disable-pip-version-check 'requests>=2.32.0,<3.0.0' 'Pillow>=10.0.0,<14.0.0'

      - name: Drain pinned owner's Telegram commands
        if: env.TELEGRAM_BOT_TOKEN != ''
        run: python scripts/telegram_feedback_sync.py

      - name: Persist owner cursor, reviews and performance metrics
        if: success() && env.TELEGRAM_BOT_TOKEN != ''
        shell: bash
        run: |
          git config user.name "bina-shor-ke-studio[bot]"
          git config user.email "bina-shor-ke-studio[bot]@users.noreply.github.com"
          git add data/telegram_state.json data/history.json data/performance_log.csv
          if ! git diff --cached --quiet; then
            git commit -m "Sync private Telegram owner feedback [skip ci]"
            git push
          fi
