name: BINA SHOR KE — Provider Fallback Integration Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bina-shor-ke-provider-fallback-test
  cancel-in-progress: false

jobs:
  simulated-fallback-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install lightweight project dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Simulate Gemini to Groq to Mistral fallback
        run: python -m unittest discover -s tests -p 'test_provider_fallback_integration.py' -v
